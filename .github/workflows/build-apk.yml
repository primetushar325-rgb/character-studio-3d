name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Release Build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install pub dependencies
        run: flutter pub get

      - name: Verify analysis
        continue-on-error: true
        run: flutter analyze

      - name: Run all tests
        run: flutter test

      - name: Ensure gradlew is executable
        run: chmod +x android/gradlew

      - name: Build release APKs (arm64 + armeabi-v7a)
        run: |
          flutter build apk --release --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-release.apk 2DCharacterStudio-v2.4.3-arm64-v8a.apk
          flutter build apk --release --target-platform android-arm -PtargetAbi=armeabi-v7a
          cp build/app/outputs/flutter-apk/app-release.apk 2DCharacterStudio-v2.4.3-armeabi-v7a.apk
          ls -lh *.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: 2DCharacterStudio-apk-v2-4-3
          path: 2DCharacterStudio-v2.4.3-*.apk
          retention-days: 90

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.4.3
          name: Character Studio 2D v2.4.3 — project open fix (critical)
          body: |
            **Character Studio 2D v2.4.1** — offline 2D story/video editor: projects, multi-object scene editor, story timeline, audio.

            🔧 v2.4.1: the app now opens on the **HOME screen** (New Project / My Projects / Characters / Settings). In v2.4.0 the shell still opened the bare editor tab by mistake — the whole project system was there, just unreachable from the entry point.

            🚑 v2.4.3 CRITICAL FIX: "My Projects" no longer spins forever and projects open correctly. Root cause: the Home screen never triggered the project-list load, and the project provider was never bound to the editor — open/create/autosave silently no-oped on device (tests had wired both manually). Now wired at app startup with a real-loading regression test, a proper ERROR+RETRY state, and safer open logging.

            🔒 v2.4.2: the release APK now requests **ZERO Android permissions** — the unused INTERNET permission (merged in by a bundler library) is explicitly removed. The app is fully offline.

            🆕 Phases 1–4:

            **Phase 2 — Scene graph & multi-object editor**
            - Real scene graph: characters, images, text and shapes as independent, movable/scalable/rotatable layers with z-order, hide and lock
            - Multiple characters in one scene (each with its own animation state) — adding never replaces
            - Gallery images imported as layers, copied into the project so they survive restarts
            - Real text + shape objects rendered by the same pipeline as the export
            - Layers panel, selection handles, canvas-relative coordinates

            **Phase 3 — Story timeline**
            - 20s default scene duration (10/15/20/30/60s presets), one deterministic playback clock (0.25×–2×)
            - Animation clips per character (walk 0–5s, wave 5–8s …) with move/trim/duplicate, loop, speed 0.25×–2× and walk→wave pose blending
            - Object visibility ranges, transform keyframes (x/y/scale/rotation/opacity) with linear/easeIn/easeOut/easeInOut, AUTO KEY, keyframe editing
            - Timeline zoom, snapping, playhead scrubbing, timeline undo/redo
            - Preview and export use the exact same evaluator

            **Phase 4 — Audio**
            - Music / voice / SFX clips imported via the system picker and copied into the project
            - Audio tracks on the same story timeline: move, non-destructive trim, volume 0–150%, mute, fade in/out, loop
            - Multi-clip preview mixing driven by the scene clock — seeks stay perfectly in sync
            - MP4 export now contains the mixed audio, rendered deterministically from the project (never a blind file attach)
            - Missing audio files offer Locate / Remove and never crash

            **Install:** download `2DCharacterStudio-v2.4.3-arm64-v8a.apk` (most devices) or `2DCharacterStudio-v2.4.3-armeabi-v7a.apk` (older 32-bit devices) below, allow "install unknown apps" if prompted, and open it. Signed with a debug key — safe for testing/sideloading.
          files: |
            2DCharacterStudio-v2.4.3-arm64-v8a.apk
            2DCharacterStudio-v2.4.3-armeabi-v7a.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
