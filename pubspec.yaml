name: character_studio_3d
description: >-
  2D Character Studio — a professional offline 2D character rigging and
  animation editor for Android. 16:9 landscape compositions, rigged 2D
  characters, keyframe animation, backgrounds, layers and real frame-based
  video/GIF/PNG export. 100% 2D — no 3D pipeline anywhere.
publish_to: "none"
version: 2.4.1+6

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State management (single consistent solution across the app)
  provider: ^6.1.2

  # Local persistence (characters, variants, editor settings, recents)
  shared_preferences: ^2.3.2

  # Filesystem access (exports, PNG sequence, saved HTML characters)
  path_provider: ^2.1.4
  path: ^1.9.0

  # firstOrNull & friends used across providers
  collection: ^1.18.0

  # Android system file picker (character PNGs + background gallery images)
  file_picker: ^8.1.3

  # Share exported videos / GIFs / characters via the Android sharesheet
  share_plus: ^10.1.4

  # Real offline video encoding (H.264 MP4) from rendered frames.
  # min-gpl build: libx264 only, no network codecs.
  ffmpeg_kit_flutter_new_min_gpl: ^2.6.2

  # Audio preview in the editor (streamed file playback — no full-file
  # decode into Dart memory). Export mixing is done by ffmpeg-kit above.
  audioplayers: ^6.1.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
